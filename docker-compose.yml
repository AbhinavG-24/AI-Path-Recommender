version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnpath
      POSTGRES_PASSWORD: learnpath
      POSTGRES_DB: learnpath
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnpath"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: postgresql://learnpath:learnpath@postgres:5432/learnpath
      CORS_ORIGINS: http://localhost:5173
      # ANTHROPIC_API_KEY: leave unset to run fully offline (see backend/.env.example)
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
